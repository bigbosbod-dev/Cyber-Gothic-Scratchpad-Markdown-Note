<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>† SECURE CLOUD VAULT // SUPABASE †</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Space+Mono:wght@400;700&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: 'Space Mono', 'Prompt', monospace;
      background-color: #050507;
      background-image: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.04) 0%, transparent 70%);
    }
    .gothic-title {
      font-family: 'Cinzel', serif;
      letter-spacing: 0.2em;
    }
    .sigil-card {
      background: rgba(10, 10, 14, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
      position: relative;
    }
    .sigil-card::before {
      content: "†";
      position: absolute;
      top: -8px;
      left: 12px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      background: #050507;
      padding: 0 4px;
    }
    .sigil-card::after {
      content: "†";
      position: absolute;
      bottom: -8px;
      right: 12px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      background: #050507;
      padding: 0 4px;
    }
  </style>
</head>
<body class="text-zinc-300 antialiased min-h-screen py-8 px-4 flex flex-col justify-between">

  <div class="max-w-3xl mx-auto w-full">
    
    <!-- Header -->
    <header class="flex items-center justify-between mb-6 pb-4 border-b border-zinc-800">
      <div>
        <span class="text-[10px] text-zinc-500 uppercase tracking-[0.3em] block">✦ ENCRYPTED ACCESS PROTOCOL ✦</span>
        <h1 class="gothic-title text-xl md:text-2xl font-black text-white uppercase tracking-wider mt-0.5">
          PRIVATE // CLOUD VAULT
        </h1>
      </div>
      
      <div id="auth-controls" class="text-right">
        <div class="text-[10px] text-emerald-400 font-mono tracking-wider uppercase mb-1">● SUPABASE LINKED</div>
        <span class="text-[11px] text-zinc-500 uppercase tracking-widest">MULTI-DEVICE SYNC</span>
      </div>
    </header>

    <!-- Note Pad -->
    <div id="vault-content">
      <main class="sigil-card p-4 md:p-6 mb-4">
        <input 
          type="text" 
          id="note-title" 
          placeholder="UNTITLED ENTRY..." 
          oninput="handleInput()"
          class="w-full bg-transparent text-white font-bold text-lg md:text-xl border-b border-zinc-800/80 pb-3 mb-4 outline-none placeholder:text-zinc-700 tracking-wide font-mono"
        >
        <textarea 
          id="note-body" 
          rows="16" 
          placeholder="พิมพ์ข้อความที่นี่... ข้อมูลจะบันทึกและซิงก์ข้ามอุปกรณ์อัตโนมัติ..."
          oninput="handleInput()"
          class="w-full bg-transparent text-zinc-200 placeholder:text-zinc-700 text-sm leading-relaxed outline-none resize-none font-mono"
        ></textarea>
      </main>

      <!-- Toolbar Actions -->
      <footer class="flex flex-wrap items-center justify-between gap-3 text-xs">
        <div class="flex gap-2">
          <button onclick="downloadNote()" class="px-3 py-2 border border-zinc-700 hover:border-zinc-300 bg-zinc-950 text-zinc-300 hover:text-white transition-all uppercase tracking-wider flex items-center gap-1.5">
            <i data-lucide="download" class="w-3.5 h-3.5"></i>
            EXPORT .TXT
          </button>
          <button onclick="loadNote()" class="px-3 py-2 border border-zinc-700 hover:border-zinc-300 bg-zinc-950 text-zinc-300 hover:text-white transition-all uppercase tracking-wider flex items-center gap-1.5">
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
            SYNC NOW
          </button>
        </div>
        <div class="text-right">
          <span id="sync-status" class="text-[10px] text-zinc-500 font-mono tracking-widest uppercase">IDLE</span>
          <p id="word-count" class="text-[10px] text-zinc-600 mt-0.5">0 WORDS | 0 CHARS</p>
        </div>
      </footer>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://ljotkgjiudazeutfxvei.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_i6aEENM6sSGPsXDJB0Cpvg_ThUWPG7w";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let saveTimeout = null;

    async function loadNote() {
      setSyncStatus('loading');
      try {
        const { data, error } = await supabaseClient
          .from('notes')
          .select('*')
          .eq('id', 'main_vault')
          .single();

        if (error && error.code !== 'PGRST116') throw error;

        if (data) {
          if (document.activeElement !== document.getElementById('note-title')) {
            document.getElementById('note-title').value = data.title || '';
          }
          if (document.activeElement !== document.getElementById('note-body')) {
            document.getElementById('note-body').value = data.body || '';
          }
          updateStats();
        }
        setSyncStatus('synced');
      } catch (err) {
        console.error(err);
        setSyncStatus('error');
      }
    }

    function handleInput() {
      setSyncStatus('saving');
      updateStats();

      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(async () => {
        const title = document.getElementById('note-title').value;
        const body = document.getElementById('note-body').value;

        try {
          const { error } = await supabaseClient
            .from('notes')
            .upsert({
              id: 'main_vault',
              title: title,
              body: body,
              updated_at: new Date().toISOString()
            });

          if (error) throw error;
          setSyncStatus('synced');
        } catch (err) {
          console.error(err);
          setSyncStatus('error');
        }
      }, 600);
    }

    function setSyncStatus(state) {
      const el = document.getElementById('sync-status');
      if (state === 'saving') {
        el.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-amber-400 inline-block animate-ping mr-1"></span> SAVING...`;
        el.className = "text-[10px] text-amber-400 font-mono tracking-widest uppercase";
      } else if (state === 'loading') {
        el.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-blue-400 inline-block animate-pulse mr-1"></span> SYNCING...`;
        el.className = "text-[10px] text-blue-400 font-mono tracking-widest uppercase";
      } else if (state === 'synced') {
        el.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block mr-1"></span> CLOUD SYNCED`;
        el.className = "text-[10px] text-emerald-400 font-mono tracking-widest uppercase";
      } else {
        el.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-red-400 inline-block mr-1"></span> SYNC ERROR`;
        el.className = "text-[10px] text-red-400 font-mono tracking-widest uppercase";
      }
    }

    function updateStats() {
      const body = document.getElementById('note-body').value;
      const chars = body.length;
      const words = body.trim() ? body.trim().split(/\s+/).length : 0;
      document.getElementById('word-count').innerText = `${words} WORDS | ${chars} CHARS`;
    }

    function downloadNote() {
      const title = document.getElementById('note-title').value.trim() || 'vault-note';
      const body = document.getElementById('note-body').value;
      const blob = new Blob([`${title.toUpperCase()}\n\n${body}`], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${title.toLowerCase().replace(/\s+/g, '-')}.txt`;
      a.click();
    }

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      loadNote();
    });
  </script>
</body>
</html>
