<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>† CYBER GOTHIC // GIST VAULT †</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Space+Mono:wght@400;700&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Space Mono', 'Prompt', monospace;
      background-color: #050507;
      background-image: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.04) 0%, transparent 70%);
    }
    .gothic-title {
      font-family: 'Cinzel', serif;
      letter-spacing: 0.2em;
    }
    .sigil-card {
      background: rgba(10, 10, 14, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
      position: relative;
    }
    .sigil-card::before {
      content: "†";
      position: absolute;
      top: -8px;
      left: 12px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      background: #050507;
      padding: 0 4px;
    }
    .sigil-card::after {
      content: "†";
      position: absolute;
      bottom: -8px;
      right: 12px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      background: #050507;
      padding: 0 4px;
    }
  </style>
</head>
<body class="text-zinc-300 antialiased min-h-screen py-8 px-4 flex flex-col justify-between">

  <div class="max-w-3xl mx-auto w-full">
    
    <!-- Header -->
    <header class="flex items-center justify-between mb-6 pb-4 border-b border-zinc-800">
      <div>
        <span class="text-[10px] text-zinc-500 uppercase tracking-[0.3em] block">✦ ENCRYPTED ACCESS PROTOCOL ✦</span>
        <h1 class="gothic-title text-xl md:text-2xl font-black text-white uppercase tracking-wider mt-0.5">
          GIST // VAULT NOTE
        </h1>
      </div>
      
      <div id="auth-controls" class="text-right">
        <!-- JS Rendered -->
      </div>
    </header>

    <!-- Token Setup Modal (แสดงเฉพาะครั้งแรกที่ยังไม่ได้ใส่ Token) -->
    <div id="token-modal" class="hidden sigil-card p-8 md:p-10 text-center my-8">
      <i data-lucide="key" class="w-8 h-8 text-zinc-500 mx-auto mb-4"></i>
      <h2 class="text-sm font-bold uppercase tracking-widest text-white mb-2">ENTER GITHUB ACCESS TOKEN</h2>
      <p class="text-xs text-zinc-500 max-w-sm mx-auto mb-6">กรอก Personal Access Token ของคุณเพื่อเชื่อมต่อ Cloud Storage ส่วนตัว (จะถูกเก็บไว้เฉพาะในเครื่องนี้เท่านั้น)</p>
      
      <div class="max-w-md mx-auto space-y-3">
        <input 
          type="password" 
          id="input-token" 
          placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" 
          class="w-full bg-zinc-900 border border-zinc-700 px-4 py-2.5 text-xs text-white outline-none focus:border-zinc-400 font-mono text-center tracking-wider"
        >
        <button 
          onclick="saveToken()" 
          class="w-full py-2.5 bg-white text-black font-bold text-xs uppercase tracking-widest hover:bg-zinc-200 transition-all active:scale-95 shadow-lg"
        >
          ✦ CONNECT VAULT ✦
        </button>
      </div>
    </div>

    <!-- Note Pad -->
    <div id="vault-content" class="hidden">
      <main class="sigil-card p-4 md:p-6 mb-4">
        <input 
          type="text" 
          id="note-title" 
          placeholder="UNTITLED ENTRY..." 
          oninput="handleInput()"
          class="w-full bg-transparent text-white font-bold text-lg md:text-xl border-b border-zinc-800/80 pb-3 mb-4 outline-none placeholder:text-zinc-700 tracking-wide font-mono"
        >
        <textarea 
          id="note-body" 
          rows="16" 
          placeholder="กำลังโหลดข้อมูลจาก GitHub Gist..."
          oninput="handleInput()"
          class="w-full bg-transparent text-zinc-200 placeholder:text-zinc-700 text-sm leading-relaxed outline-none resize-none font-mono"
        ></textarea>
      </main>

      <!-- Toolbar Actions -->
      <footer class="flex flex-wrap items-center justify-between gap-3 text-xs">
        <div class="flex gap-2">
          <button onclick="downloadNote()" class="px-3 py-2 border border-zinc-700 hover:border-zinc-300 bg-zinc-950 text-zinc-300 hover:text-white transition-all uppercase tracking-wider flex items-center gap-1.5">
            <i data-lucide="download" class="w-3.5 h-3.5"></i>
            EXPORT .TXT
          </button>
          <button onclick="fetchLatestNote()" class="px-3 py-2 border border-zinc-700 hover:border-zinc-300 bg-zinc-950 text-zinc-300 hover:text-white transition-all uppercase tracking-wider flex items-center gap-1.5">
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5"></i>
            SYNC NOW
          </button>
        </div>
        <div class="text-right">
          <span id="sync-status" class="text-[10px] text-zinc-500 font-mono tracking-widest uppercase">IDLE</span>
          <p id="word-count" class="text-[10px] text-zinc-600 mt-0.5">0 WORDS | 0 CHARS</p>
        </div>
      </footer>
    </div>

  </div>

  <script>
    const GIST_FILENAME = "cyber_vault_note.json";
    let githubToken = localStorage.getItem("vault_gh_token") || null;
    let gistId = localStorage.getItem("vault_gist_id") || null;
    let saveTimeout = null;

    function initAuth() {
      const modal = document.getElementById("token-modal");
      const vault = document.getElementById("vault-content");
      const controls = document.getElementById("auth-controls");

      if (!githubToken) {
        modal.classList.remove("hidden");
        vault.classList.add("hidden");
        controls.innerHTML = `<span class="text-[10px] text-zinc-600 font-mono uppercase">LOCKED</span>`;
      } else {
        modal.classList.add("hidden");
        vault.classList.remove("hidden");
        controls.innerHTML = `
          <div class="text-[10px] text-emerald-400 font-mono tracking-wider uppercase mb-1">● GIST SYNC LINKED</div>
          <button onclick="clearToken()" class="text-[10px] text-zinc-500 hover:text-zinc-200 underline uppercase tracking-widest">DISCONNECT</button>
        `;
        initVault();
      }
      lucide.createIcons();
    }

    function saveToken() {
      const input = document.getElementById("input-token").value.trim();
      if (!input.startsWith("ghp_")) {
        alert("กรุณากรอก GitHub Token ที่ขึ้นต้นด้วย ghp_ ให้ถูกต้องครับ");
        return;
      }
      localStorage.setItem("vault_gh_token", input);
      githubToken = input;
      initAuth();
    }

    function clearToken() {
      if (confirm("ต้องการตัดการเชื่อมต่อ Token จากเครื่องนี้ใช่หรือไม่?")) {
        localStorage.removeItem("vault_gh_token");
        localStorage.removeItem("vault_gist_id");
        githubToken = null;
        gistId = null;
        initAuth();
      }
    }

    async function initVault() {
      setSyncStatus('loading');
      try {
        if (!gistId) {
          const res = await fetch("https://api.github.com/gists", {
            headers: { Authorization: `token ${githubToken}` }
          });
          const gists = await res.json();
          const existingGist = gists.find(g => g.files && g.files[GIST_FILENAME]);

          if (existingGist) {
            gistId = existingGist.id;
            localStorage.setItem("vault_gist_id", gistId);
          } else {
            const createRes = await fetch("https://api.github.com/gists", {
              method: "POST",
              headers: {
                Authorization: `token ${githubToken}`,
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                description: "CYBER GOTHIC VAULT STORAGE [SECURE]",
                public: false,
                files: {
                  [GIST_FILENAME]: {
                    content: JSON.stringify({ title: "", body: "" })
                  }
                }
              })
            });
            const newGist = await createRes.json();
            gistId = newGist.id;
            localStorage.setItem("vault_gist_id", gistId);
          }
        }
        await fetchLatestNote();
      } catch (err) {
        console.error(err);
        setSyncStatus('error');
      }
    }

    async function fetchLatestNote() {
      if (!gistId) return;
      setSyncStatus('loading');
      try {
        const res = await fetch(`https://api.github.com/gists/${gistId}`, {
          headers: { Authorization: `token ${githubToken}` }
        });
        const data = await res.json();
        const fileContent = data.files[GIST_FILENAME]?.content;
        
        if (fileContent) {
          const parsed = JSON.parse(fileContent);
          document.getElementById('note-title').value = parsed.title || '';
          document.getElementById('note-body').value = parsed.body || '';
          document.getElementById('note-body').placeholder = "พิมพ์ข้อความที่นี่... ระบบจะซิงก์ขึ้น GitHub Gist อัตโนมัติ...";
          updateStats();
        }
        setSyncStatus('synced');
      } catch (err) {
        console.error(err);
        setSyncStatus('error');
      }
    }

    function handleInput() {
      setSyncStatus('saving');
      updateStats();

      clearTimeout(saveTimeout);
      saveTimeout = setTimeout(async () => {
        const title = document.getElementById('note-title').value;
        const body = document.getElementById('note-body').value;

        try {
          await fetch(`https://api.github.com/gists/${gistId}`, {
            method: "PATCH",
            headers: {
              Authorization: `token ${githubToken}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              files: {
                [GIST_FILENAME]: {
                  content: JSON.stringify({ title, body, updatedAt: new Date().toISOString() })
                }
              }
            })
          });
          setSyncStatus('synced');
        } catch (err) {
          console.error(err);
          setSyncStatus('error');
        }
      }, 800);
    }

    function setSyncStatus(state) {
      const el = document.getElementById('sync-status');
      if (state === 'saving') {
        el.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-amber-400 inline-block animate-ping mr-1"></span> SAVING...`;
        el.className = "text-[10px] text-amber-400 font-mono tracking-widest uppercase";
      } else if (state === 'loading') {
        el.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-blue-400 inline-block animate-spin mr-1"></span> SYNCING...`;
        el.className = "text-[10px] text-blue-400 font-mono tracking-widest uppercase";
      } else if (state === 'synced') {
        el.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block mr-1"></span> ENCRYPTED & SYNCED`;
        el.className = "text-[10px] text-emerald-400 font-mono tracking-widest uppercase";
      } else {
        el.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-red-400 inline-block mr-1"></span> SYNC FAILED`;
        el.className = "text-[10px] text-red-400 font-mono tracking-widest uppercase";
      }
    }

    function updateStats() {
      const body = document.getElementById('note-body').value;
      const chars = body.length;
      const words = body.trim() ? body.trim().split(/\s+/).length : 0;
      document.getElementById('word-count').innerText = `${words} WORDS | ${chars} CHARS`;
    }

    function downloadNote() {
      const title = document.getElementById('note-title').value.trim() || 'private-vault';
      const body = document.getElementById('note-body').value;
      const blob = new Blob([`${title.toUpperCase()}\n\n${body}`], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${title.toLowerCase().replace(/\s+/g, '-')}.txt`;
      a.click();
    }

    initAuth();
  </script>
</body>
</html>
