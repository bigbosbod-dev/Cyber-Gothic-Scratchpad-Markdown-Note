<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>† CYBER GOTHIC // PRIVATE VAULT †</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Space+Mono:wght@400;700&family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Space Mono', 'Prompt', monospace;
      background-color: #050507;
      background-image: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.04) 0%, transparent 70%);
    }
    .gothic-title {
      font-family: 'Cinzel', serif;
      letter-spacing: 0.2em;
    }
    .sigil-card {
      background: rgba(10, 10, 14, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
      position: relative;
    }
    .sigil-card::before {
      content: "†";
      position: absolute;
      top: -8px;
      left: 12px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      background: #050507;
      padding: 0 4px;
    }
    .sigil-card::after {
      content: "†";
      position: absolute;
      bottom: -8px;
      right: 12px;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      background: #050507;
      padding: 0 4px;
    }
  </style>
</head>
<body class="text-zinc-300 antialiased min-h-screen py-8 px-4 flex flex-col justify-between">

  <div class="max-w-3xl mx-auto w-full">
    
    <!-- Header -->
    <header class="flex items-center justify-between mb-6 pb-4 border-b border-zinc-800">
      <div>
        <span class="text-[10px] text-zinc-500 uppercase tracking-[0.3em] block">✦ ENCRYPTED ACCESS PROTOCOL ✦</span>
        <h1 class="gothic-title text-xl md:text-2xl font-black text-white uppercase tracking-wider mt-0.5">
          PRIVATE // VAULT NOTE
        </h1>
      </div>
      
      <div id="auth-controls" class="text-right">
        <span class="text-[10px] text-zinc-600 font-mono tracking-wider uppercase">LOCKED</span>
      </div>
    </header>

    <!-- Master Password Screen -->
    <div id="lock-screen" class="sigil-card p-8 md:p-12 text-center my-8">
      <div class="text-2xl mb-3">🔒</div>
      <h2 class="text-sm font-bold uppercase tracking-widest text-white mb-2">ENTER MASTER KEY</h2>
      <p class="text-xs text-zinc-500 max-w-sm mx-auto mb-6">ตั้งรหัสผ่านสำหรับเปิดอ่านและเข้ารหัสข้อมูลลับของคุณ (ระบบจะใช้รหัสนี้เข้ารหัสแบบ AES-256)</p>
      
      <div class="max-w-xs mx-auto space-y-3">
        <input 
          type="password" 
          id="master-pass" 
          placeholder="••••••••••••" 
          onkeydown="if(event.key==='Enter') unlockVault()"
          class="w-full bg-zinc-900 border border-zinc-700 px-4 py-2.5 text-center text-white outline-none focus:border-zinc-400 font-mono tracking-widest text-sm"
        >
        <button 
          onclick="unlockVault()" 
          class="w-full py-2.5 bg-white text-black font-bold text-xs uppercase tracking-widest hover:bg-zinc-200 transition-all active:scale-95 shadow-lg"
        >
          ✦ UNLOCK VAULT ✦
        </button>
      </div>
    </div>

    <!-- Note Pad (Unlocked) -->
    <div id="vault-screen" class="hidden">
      <main class="sigil-card p-4 md:p-6 mb-4">
        <input 
          type="text" 
          id="note-title" 
          placeholder="UNTITLED ENTRY..." 
          oninput="saveEncryptedNote()"
          class="w-full bg-transparent text-white font-bold text-lg md:text-xl border-b border-zinc-800/80 pb-3 mb-4 outline-none placeholder:text-zinc-700 tracking-wide font-mono"
        >
        <textarea 
          id="note-body" 
          rows="16" 
          placeholder="พิมพ์ข้อความที่นี่... ข้อมูลทั้งหมดถูกเข้ารหัสลับและจัดเก็บบนเครื่องของคุณโดยอัตโนมัติ..."
          oninput="saveEncryptedNote()"
          class="w-full bg-transparent text-zinc-200 placeholder:text-zinc-700 text-sm leading-relaxed outline-none resize-none font-mono"
        ></textarea>
      </main>

      <!-- Toolbar Actions -->
      <footer class="flex flex-wrap items-center justify-between gap-3 text-xs">
        <div class="flex gap-2">
          <button onclick="downloadNote()" class="px-3 py-2 border border-zinc-700 hover:border-zinc-300 bg-zinc-950 text-zinc-300 hover:text-white transition-all uppercase tracking-wider">
            EXPORT .TXT
          </button>
          <button onclick="lockVault()" class="px-3 py-2 border border-zinc-700 hover:border-red-500 bg-zinc-950 text-zinc-400 hover:text-red-400 transition-all uppercase tracking-wider">
            LOCK NOW
          </button>
        </div>
        <div class="text-right">
          <span id="sync-status" class="text-[10px] text-emerald-400 font-mono tracking-widest uppercase">● ENCRYPTED & SAVED</span>
          <p id="word-count" class="text-[10px] text-zinc-600 mt-0.5">0 WORDS | 0 CHARS</p>
        </div>
      </footer>
    </div>

  </div>

  <script>
    let currentKey = null;

    // ระบบเข้ารหัส/ถอดรหัส Web Crypto API
    async function deriveKey(passphrase) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(passphrase), { name: "PBKDF2" }, false, ["deriveKey"]);
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: enc.encode("cyber_gothic_salt"), iterations: 100000, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function unlockVault() {
      const pass = document.getElementById("master-pass").value;
      if (!pass) return alert("กรุณาใส่รหัสผ่าน");

      try {
        currentKey = await deriveKey(pass);
        const encryptedData = localStorage.getItem("vault_cipher_data");

        if (encryptedData) {
          try {
            const { iv, data } = JSON.parse(encryptedData);
            const decrypted = await crypto.subtle.decrypt(
              { name: "AES-GCM", iv: new Uint8Array(iv) },
              currentKey,
              new Uint8Array(data)
            );
            const dec = new TextDecoder();
            const note = JSON.parse(dec.decode(decrypted));
            document.getElementById("note-title").value = note.title || "";
            document.getElementById("note-body").value = note.body || "";
          } catch (e) {
            return alert("รหัสผ่านไม่ถูกต้อง หรือข้อมูลถูกเข้ารหัสด้วยรหัสอื่น!");
          }
        }

        document.getElementById("lock-screen").classList.add("hidden");
        document.getElementById("vault-screen").classList.remove("hidden");
        document.getElementById("auth-controls").innerHTML = `
          <div class="text-[10px] text-emerald-400 font-mono tracking-wider uppercase mb-1">● VAULT UNLOCKED</div>
          <button onclick="lockVault()" class="text-[10px] text-zinc-500 hover:text-zinc-200 underline uppercase tracking-widest">LOCK</button>
        `;
        updateStats();
      } catch (err) {
        alert("เกิดข้อผิดพลาด: " + err.message);
      }
    }

    async function saveEncryptedNote() {
      if (!currentKey) return;
      updateStats();

      const title = document.getElementById("note-title").value;
      const body = document.getElementById("note-body").value;
      const noteStr = JSON.stringify({ title, body, updatedAt: new Date().toISOString() });

      const enc = new TextEncoder();
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encrypted = await crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        currentKey,
        enc.encode(noteStr)
      );

      localStorage.setItem("vault_cipher_data", JSON.stringify({
        iv: Array.from(iv),
        data: Array.from(new Uint8Array(encrypted))
      }));
    }

    function lockVault() {
      currentKey = null;
      document.getElementById("master-pass").value = "";
      document.getElementById("note-title").value = "";
      document.getElementById("note-body").value = "";
      document.getElementById("vault-screen").classList.add("hidden");
      document.getElementById("lock-screen").classList.remove("hidden");
      document.getElementById("auth-controls").innerHTML = `<span class="text-[10px] text-zinc-600 font-mono tracking-wider uppercase">LOCKED</span>`;
    }

    function updateStats() {
      const body = document.getElementById('note-body').value;
      const chars = body.length;
      const words = body.trim() ? body.trim().split(/\s+/).length : 0;
      document.getElementById('word-count').innerText = `${words} WORDS | ${chars} CHARS`;
    }

    function downloadNote() {
      const title = document.getElementById('note-title').value.trim() || 'vault-note';
      const body = document.getElementById('note-body').value;
      const blob = new Blob([`${title.toUpperCase()}\n\n${body}`], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${title.toLowerCase().replace(/\s+/g, '-')}.txt`;
      a.click();
    }
  </script>
</body>
</html>
